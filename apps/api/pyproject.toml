[project]
name = "legalai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3", "argon2-cffi>=23.1",
  "httpx>=0.27", "python-multipart>=0.0.9", "email-validator>=2.1",
  "pgvector>=0.3", "pypdf>=5.0", "defusedxml>=0.7",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["legalai*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
