name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell-and-tools:
    name: Shell and tools (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legalai
          POSTGRES_PASSWORD: legalai-dev
          POSTGRES_DB: founderos_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U legalai" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: shell
      - name: Lint (shell)
        run: npm run lint
        working-directory: shell
      - name: Lint (tools)
        run: npx --prefix shell eslint -c shell/eslint.config.mjs modules/*/src modules/*/test
      - name: Tests (tools and shell libraries, real Postgres)
        run: npx vitest run
        env:
          TEST_DATABASE_URL: postgresql://legalai:legalai-dev@localhost:5442/founderos_test
      - name: Production build
        run: npm run build --workspace shell

  legalai:
    name: LegalAI (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalai
          POSTGRES_PASSWORD: legalai-dev
          POSTGRES_DB: legalai
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U legalai" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/legal/api/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr postgresql-client
      - run: pip install -e "modules/legal/api[dev]"
      - name: Tests
        run: python -m pytest -q
        working-directory: modules/legal/api
